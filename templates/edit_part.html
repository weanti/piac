<!DOCTYPE html>
<html>
<head>
    <title>Edit Part</title>
</head>
<body>
    <h1>Edit Part</h1>

    <form>
    <label for="brand">Brand</label><input type="text" id="brand" name="brand" value="{{.Brand}}"><br>
    <label for="model">Model</label><input type="text" id="model" name="model" value="{{.Model}}"><br>
    <label for="description">Description</label><input type="text" id="description" name="description" value="{{.Description}}"><br>
    <label for="count">Count</label><input type="text" id="count" name="count" value="{{.Count}}"><br>
    <label for="price">Price</label><input type="text" id="price" name="price" value="{{.Price}}"><br>
    <label for="image">Image</label><input type="file" id="image" name="image" value="{{.Image}}"><br>
    <input type="submit" value="Save">
    </form>
</body>
</html>
