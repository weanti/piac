<!DOCTYPE html>
<html>
<head>
    <title>Parts</title>
</head>
<body>
    <h1>Parts</h1>

    <!-- parts -->
    <table border="1" title="Parts">
	<tr><td>Brand</td><td>Model</td><td>Description</td><td>Count</td><td>Price</td><td>Image</td><td><!-- edit --></td></tr>
	{{range .}}
	<tr><td>{{.Brand}}</td><td>{{.Model}}</td><td>{{.Description}}</td><td>{{.Count}}</td><td>{{.Price}}</td><td><img src="/images/{{.Image}}"></td><td><a href="edit_part.html?id={{.Id}}">Edit</a></td></tr>
	{{end}}
    </table>
    <a href="edit_part.html?id=">Add part</a>
    
</body>
</html>
