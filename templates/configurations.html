<!DOCTYPE html>
<html>
<head>
    <title>Configurations</title>
</head>
<body>
    <h1>Configurations</h1>

    <table border="1" title="Configurations">
	    <tr><td>Name</td><td>Description</td> <td>Parts</td> <td>Price</td><td>Additional price</td><td>Additional price description</td><td><!-- edit --></td></tr>
	{{range .}}
	<tr>	<td>{{.Name}}</td> <td>{{.Description}}</td>
		<td> <!-- parts -->
		    <table border="1" title="Parts">
			<tr><td>Brand</td><td>Model</td><td><!-- edit --></td></tr>
			{{range .Parts}}
			<tr><td>{{.Brand}}</td><td>{{.Model}}</td><td><a href="edit_part.html?id={{.Id}}">Edit</a></td></tr>
			{{end}}
		    </table>
		</td>
    	<td>{{.Price}}</td>
		<td>{{.AdditionalPrice}}</td>
		<td>{{.AdditionalPriceDesc}}</td>
		<td><a href="edit_configuration.html?id={{.Id}}">Edit</a></td>
	</tr>
	{{end}}
    </table>
    <a href="edit_configuration.html?id=">Add configuration</a>
</body>
</html>
